name: Build and Push Docker Images

on:
  push:
    tags: ["v*"] # Only build on version tags (e.g., v1.0.1)

env:
  REGISTRY: docker.io
  IMAGE_NAME: carrotwaxr/peek-stash-browser

# Each architecture is built on its own native runner, booted against an empty
# volume and pushed by digest (image-smoke.yml); amd64 also upgrades a
# database the latest release created, then restores its pre-migration backup
# on that release. Only when both pass does the publish job point the release
# tags at the two digests. There is no QEMU build: arm64 is built on GitHub's
# arm64 runner.
jobs:
  smoke:
    name: Image Smoke Test
    uses: ./.github/workflows/image-smoke.yml
    with:
      publish: true
      upgrade-check: true
      build-date: ${{ github.event.head_commit.timestamp }}
    secrets: inherit

  publish:
    name: Publish
    needs: smoke
    runs-on: ubuntu-latest
    permissions:
      contents: write # creates the GitHub release; images go to Docker Hub

    steps:
      - name: Download the tested digests
        uses: actions/download-artifact@v8
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}
            type=raw,value=stable,enable=${{ !contains(github.ref_name, '-') }}
            type=raw,value=beta,enable=${{ contains(github.ref_name, '-beta') }}

      # One digest per architecture; with fewer, the tags would move to an
      # image that lacks a platform
      - name: Point the tags at the tested images
        working-directory: ${{ runner.temp }}/digests
        run: |
          ls
          test "$(find . -maxdepth 1 -type f | wc -l)" -eq 2
          # shellcheck disable=SC2046 # one word per -t flag and per digest
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf '${{ env.IMAGE_NAME }}@sha256:%s ' *)

      - name: Inspect
        run: docker buildx imagetools inspect ${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.version }}

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
