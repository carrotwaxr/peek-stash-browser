name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  # A new push to a pull request cancels its superseded run. Pushes to main get
  # a group per commit, so none is cancelled or dropped from the queue.
  group: ${{ github.event_name == 'pull_request' && format('ci-{0}', github.ref) || format('ci-{0}', github.sha) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  format:
    name: Format
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Prettier
        run: npm run format:check

  client:
    name: Client Checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            client/package-lock.json
            shared/package-lock.json

      - run: npm ci

      - name: Build shared types
        working-directory: shared
        run: npm ci && npm run build

      - name: Lint shared
        working-directory: shared
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Test with coverage
        run: npm run test:coverage

  server:
    name: Server Checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: server/package-lock.json

      - run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Set up test database
        run: npx prisma migrate deploy
        env:
          DATABASE_URL: file:./test.db

      - name: Build shared types
        working-directory: shared
        run: npm ci && npm run build

      - name: Provide integration test fixture
        # testEntities.ts is gitignored (each developer's own Stash IDs); the
        # example has the same keys, which is all type checking and lint need.
        run: cp integration/fixtures/testEntities.example.ts integration/fixtures/testEntities.ts

      - name: Lint
        run: npm run lint

      - name: TypeScript Compile
        run: npx tsc --noEmit

      - name: Type-check tests
        run: npm run typecheck:tests

      - name: Test with coverage
        run: npm run test:coverage
        env:
          DATABASE_URL: file:./test.db
          JWT_SECRET: ci-test-secret

  audit:
    name: Dependency Audit
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      # Runtime dependencies only: dev tooling does not ship in the image.
      - name: Audit server
        working-directory: server
        run: npm audit --omit=dev --audit-level=high

      - name: Audit client
        if: ${{ !cancelled() }}
        working-directory: client
        run: npm audit --omit=dev --audit-level=high

      - name: Audit shared
        if: ${{ !cancelled() }}
        working-directory: shared
        run: npm audit --omit=dev --audit-level=high

      - name: Audit root
        if: ${{ !cancelled() }}
        run: npm audit --omit=dev --audit-level=high

  e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    needs: [client, server]

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            client/package-lock.json
            server/package-lock.json
            shared/package-lock.json

      - name: Install root dependencies
        run: npm ci

      - name: Install client dependencies
        run: cd client && npm ci

      - name: Install server dependencies
        run: cd server && npm ci

      - name: Build shared types
        run: cd shared && npm ci && npm run build

      - name: Generate Prisma Client
        run: cd server && npx prisma generate

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Install Playwright OS dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: Run E2E tests
        run: npx playwright test
        env:
          CI: true
          E2E_USERNAME: admin
          E2E_PASSWORD: admin123

      - name: Upload Playwright report
        uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

  image:
    name: Image Smoke Test
    uses: ./.github/workflows/image-smoke.yml
    with:
      browser-checks: true

  # Integration tests require access to a Stash test instance on the local network.
  # This job only runs on self-hosted runners with network access to the test server.
  # To enable: add a self-hosted runner on the same network as the Stash test instance,
  # configure STASH_TEST_URL and STASH_TEST_API_KEY as repository secrets,
  # and change 'if: false' to 'if: true' (or use a different condition).
  integration:
    name: Integration Tests
    runs-on: ubuntu-latest
    if: false # Disabled until self-hosted runner or VPN is configured
    needs: [server]
    defaults:
      run:
        working-directory: server

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: server/package-lock.json

      - run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Run Integration Tests
        run: npm run test:integration
        env:
          STASH_TEST_URL: ${{ secrets.STASH_TEST_URL }}
          STASH_TEST_API_KEY: ${{ secrets.STASH_TEST_API_KEY }}
