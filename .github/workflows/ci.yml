name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  # A new push to a pull request cancels its superseded run. Pushes to main get
  # a group per commit, so none is cancelled or dropped from the queue.
  group: ${{ github.event_name == 'pull_request' && format('ci-{0}', github.ref) || format('ci-{0}', github.sha) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  format:
    name: Format
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Prettier
        run: npm run format:check

  client:
    name: Client Checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            client/package-lock.json
            shared/package-lock.json

      - run: npm ci

      - name: Build shared types
        working-directory: shared
        run: npm ci && npm run build

      - name: Lint shared
        working-directory: shared
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Test with coverage
        run: npm run test:coverage

  server:
    name: Server Checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: server/package-lock.json

      - run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Set up test database
        run: npx prisma migrate deploy
        env:
          DATABASE_URL: file:./test.db

      # Replays every migration into a shadow database and diffs it against
      # schema.prisma: a migration that leaves the two apart fails here
      - name: Schema matches the migrations
        run: npm run db:drift

      - name: Build shared types
        working-directory: shared
        run: npm ci && npm run build

      - name: Lint
        run: npm run lint

      - name: TypeScript Compile
        run: npx tsc --noEmit

      - name: Type-check tests
        run: npm run typecheck:tests

      - name: Test with coverage
        run: npm run test:coverage
        env:
          DATABASE_URL: file:./test.db
          JWT_SECRET: ci-test-secret

  audit:
    name: Dependency Audit
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      # Runtime dependencies only: dev tooling does not ship in the image.
      - name: Audit server
        working-directory: server
        run: npm audit --omit=dev --audit-level=high

      - name: Audit client
        if: ${{ !cancelled() }}
        working-directory: client
        run: npm audit --omit=dev --audit-level=high

      - name: Audit shared
        if: ${{ !cancelled() }}
        working-directory: shared
        run: npm audit --omit=dev --audit-level=high

      - name: Audit root
        if: ${{ !cancelled() }}
        run: npm audit --omit=dev --audit-level=high

  e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    needs: [client, server]

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            client/package-lock.json
            server/package-lock.json
            shared/package-lock.json

      - name: Install root dependencies
        run: npm ci

      - name: Install client dependencies
        run: cd client && npm ci

      - name: Install server dependencies
        run: cd server && npm ci

      - name: Build shared types
        run: cd shared && npm ci && npm run build

      - name: Generate Prisma Client
        run: cd server && npx prisma generate

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Install Playwright OS dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      # Hermetic: Playwright starts its own server and client on a throwaway
      # database, and global setup creates the run admin (e2e/support/env.ts)
      - name: Run E2E tests
        run: npx playwright test
        env:
          CI: true

      - name: Upload Playwright report
        uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

  # The image smoke test's upgrade check boots the latest release first and
  # adds about 2 minutes, so it runs only when a change can affect upgrading:
  # the schema and migrations, the startup code that applies them, the image,
  # and the workflows that run the check
  changes:
    name: Changed Paths
    runs-on: ubuntu-latest
    outputs:
      upgrade-check: ${{ steps.paths.outputs.upgrade-check }}

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # A pull request's checkout is its merge commit, whose first parent is
      # the base it merges into; a push compares with the commit it replaced.
      # When the base is unknown (a new branch), the check runs.
      - name: Does the change touch the upgrade path?
        id: paths
        env:
          BASE: ${{ github.event_name == 'pull_request' && 'HEAD^1' || github.event.before }}
        run: |
          pattern='^(server/prisma/|server/initializers/|docker/|\.github/workflows/(image-smoke|docker-build)\.yml$)'
          if changed=$(git diff --name-only "$BASE" HEAD 2>/dev/null); then
            if grep -qE "$pattern" <<< "$changed"; then
              result=true
            else
              result=false
            fi
          else
            result=true
          fi
          echo "upgrade-check=$result" >> "$GITHUB_OUTPUT"
          echo "Upgrade check: $result"

  image:
    name: Image Smoke Test
    needs: changes
    uses: ./.github/workflows/image-smoke.yml
    with:
      browser-checks: true
      upgrade-check: ${{ needs.changes.outputs.upgrade-check == 'true' }}

  # Integration tests run against a synthetic replay of the test Stash
  # (server/integration/stash-replay), served on localhost: no secrets and no
  # network, so pull requests from forks run them too.
  integration:
    name: Integration Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: server

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            server/package-lock.json
            shared/package-lock.json

      - run: npm ci

      - name: Build shared types
        working-directory: shared
        run: npm ci && npm run build

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Integration tests (replayed Stash)
        run: npm run test:integration:replay

      - name: No skipped or failed tests
        run: node -e "const s=require('./integration/results/summary.json'); console.log(s); if (s.failed !== 0 || s.skipped !== 0) process.exit(1)"

      - name: Upload integration results
        uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: integration-results
          path: server/integration/results/
          retention-days: 14
