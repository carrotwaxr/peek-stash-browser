# Full main config (/etc/nginx/nginx.conf). The master runs as root to bind
# port 80; docker/entrypoint.sh starts it with "user peek peek;" so the workers
# run as PUID:PGID. Every writable path is under /tmp/nginx, which the
# entrypoint creates.
worker_processes auto;
pid /tmp/nginx/nginx.pid;
error_log stderr warn;

events {
    worker_connections 768;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    sendfile on;
    tcp_nopush on;
    types_hash_max_size 2048;
    gzip on;

    # Was an unbounded file in the container layer, with full URIs; Node logs what matters
    access_log off;

    client_body_temp_path /tmp/nginx/body;
    proxy_temp_path /tmp/nginx/proxy;
    fastcgi_temp_path /tmp/nginx/fastcgi;
    uwsgi_temp_path /tmp/nginx/uwsgi;
    scgi_temp_path /tmp/nginx/scgi;

    server {
        listen 80;
        server_name localhost;
        root /app/frontend;

        server_tokens off;
        proxy_hide_header X-Powered-By;

        # Security headers, sent once here for every response. A location with
        # its own add_header would drop all of these, so none may use it:
        # caching below uses "expires".
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' blob:; font-src 'self' data:; connect-src 'self' https://api.github.com; worker-src 'self' blob:; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "same-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

        # The page shell: revalidate every time, so an upgrade is seen at once
        location = /index.html { expires -1; }

        # Hashed names never change; a missing chunk is a 404, not index.html
        location /assets/ { try_files $uri =404; expires max; }

        # Icons and the manifest; SPA routes fall through to /index.html
        location / { try_files $uri $uri/ /index.html; expires 1h; }

        # Long timeout for Stash sync endpoint (can take several minutes for large libraries)
        # Matches /api/user/:userId/sync-from-stash
        location ~ ^/api/user/[^/]+/sync-from-stash$ {
            proxy_pass http://localhost:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_set_header Connection "";

            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 900s;  # 15 minutes for Stash sync operations
        }

        # Long timeout for video stream proxying (direct play, HLS segments)
        # Without this, Nginx kills streams on slow connections causing playback failures
        location ~ ^/api/scene/[^/]+/proxy-stream/ {
            proxy_pass http://localhost:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_buffering off;

            proxy_connect_timeout 60s;
            proxy_send_timeout 300s;
            proxy_read_timeout 300s;  # 5 minutes for video streams
        }

        # Proxy API requests to backend (standard timeout)
        location /api/ {
            proxy_pass http://localhost:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_set_header Connection "";

            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;  # Standard 60 second timeout for regular API calls
        }
    }
}
